<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradebot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --text: #111827; --muted: #6b7280;
  --border: #e5e7eb; --accent: #2563eb; --accent-text: #fff; --up: #059669; --down: #dc2626;
  --warn: #b45309; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --grid: #eceef2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1f2630; --text: #e6edf3; --muted: #8b949e;
    --border: #2b323c; --accent: #3b82f6; --up: #34d399; --down: #f87171; --warn: #fbbf24;
    --shadow: none; --grid: #222a34;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --panel-2: #1f2630; --text: #e6edf3; --muted: #8b949e;
  --border: #2b323c; --accent: #3b82f6; --up: #34d399; --down: #f87171; --warn: #fbbf24;
  --shadow: none; --grid: #222a34;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); }
.bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 22px; height: 22px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 500; }
nav a.active, nav a:hover { color: var(--text); background: var(--panel-2); }
.spacer { flex: 1; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.cols-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--up); } .dot.off { background: var(--down); }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
button, .btn { font: inherit; font-weight: 500; border: 1px solid var(--border); background: var(--panel);
  color: var(--text); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
button:hover { background: var(--panel-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--down); }
button:disabled { opacity: .55; cursor: default; }
button.small { padding: 4px 9px; font-size: 12px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; align-content: start; }
input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
  border-radius: 7px; padding: 7px 9px; width: 100%; }
input[type=checkbox] { width: auto; }
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.form .wide { grid-column: 1 / -1; }
.inst { cursor: pointer; transition: border-color .15s; display: grid; gap: 10px; }
.inst:hover { border-color: var(--accent); }
.inst.disabled { opacity: .6; }
.inst-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.name { font-weight: 600; font-size: 15px; word-break: break-word; }
.big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.tile .l { font-size: 12px; color: var(--muted); } .tile .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .h { font-size: 11px; color: var(--muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: default; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; }
.chart { width: 100%; height: 280px; position: relative; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: var(--shadow); white-space: nowrap; display: none; z-index: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; max-height: 260px;
  overflow: auto; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.log div { white-space: pre-wrap; word-break: break-word; }
.log .ERROR { color: var(--down); } .log .WARNING { color: var(--warn); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.note { background: var(--panel-2); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
.warnbox { border-left-color: var(--warn); }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
  padding: 0; width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); z-index: 3; }
.dlg-body { padding: 16px; display: grid; gap: 16px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 9px 14px; border-radius: 8px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.toast.err { background: var(--down); color: #fff; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--border); border-radius: 20px; transition: .15s; cursor: pointer; }
.switch span::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--up); }
.switch input:checked + span::before { transform: translateX(14px); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.help summary { cursor: pointer; font-weight: 500; }
.help p, .help li { color: var(--muted); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; padding: 0;
  border-radius: 50%; font: 600 12px/1 Georgia, serif; font-style: italic; color: var(--accent); border: 1px solid var(--border);
  background: var(--panel); cursor: pointer; vertical-align: middle; flex: none; }
.ibtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.hint { font-size: 11.5px; color: var(--muted); font-weight: 400; line-height: 1.35; }
.label-row { display: flex; align-items: center; gap: 6px; }
.explain h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.explain p { margin: 0; }
.explain .sum { font-size: 16px; font-weight: 500; }
.explain section { display: grid; gap: 4px; }
.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pros-cons > div { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.pros-cons h3.good { color: var(--up); } .pros-cons h3.bad { color: var(--down); }
.gloss { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 8px 16px; }
.gloss dt { font-weight: 600; } .gloss dd { margin: 0; color: var(--muted); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.welcome { position: relative; }
#update-bar .inner { max-width: 1200px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#update-bar { background: var(--accent); color: #fff; }
#update-bar button { background: #fff; color: #1d4ed8; border-color: #fff; }
.welcome .x { position: absolute; top: 10px; right: 10px; }
@media (max-width: 640px) { .pros-cons { grid-template-columns: 1fr; } .gloss { grid-template-columns: 1fr; gap: 2px; } .gloss dd { margin-bottom: 8px; } }
@media (max-width: 640px) { .big { font-size: 19px; } nav a { padding: 6px 8px; } th, td { padding: 6px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M6 22l6-7 5 4 9-11" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>tradebot</div>
    <nav id="nav">
      <a href="#/" data-page="overview">Paper trading</a>
      <a href="#/backtest" data-page="backtest">Backtest</a>
      <a href="#/compare" data-page="compare">Compare</a>
      <a href="#/strategies" data-page="strategies">Strategies</a>
      <a href="#/settings" data-page="settings">Settings</a>
      <a href="#/guide" data-page="guide">Guide</a>
    </nav>
    <div class="spacer"></div>
    <span class="pill" id="market"><span class="dot"></span>market</span>
    <button class="small" id="theme" title="Light / dark" aria-label="Toggle light or dark theme" style="display:inline-flex;padding:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<div id="update-bar"></div>
<main id="app"></main>

<dialog id="dlg"><div class="dlg-head"><h2 id="dlg-title" style="margin:0"></h2><button class="small" onclick="dlg.close()">Close</button></div><div class="dlg-body" id="dlg-body"></div></dialog>
<dialog id="info"><div class="dlg-head"><h2 id="info-title" style="margin:0"></h2><button class="small" onclick="this.closest('dialog').close()">Close</button></div><div class="dlg-body explain" id="info-body"></div></dialog>
<div class="toast" id="toast"></div>

<script>
// ----------------------------------------------------------------- utils
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v, d = 2) => v == null ? "–" : (v * 100).toFixed(d) + "%";
const money = v => v == null ? "–" : v.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 2 });
const num = (v, d = 2) => v == null ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
const cls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const dlg = $("#dlg");
const COLORS = ["#2563eb", "#f59e0b", "#10b981", "#e11d48", "#8b5cf6", "#06b6d4", "#84cc16", "#f97316", "#ec4899", "#64748b"];
let STRATS = [];

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.detail || res.statusText);
  return data;
}
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", err ? 6000 : 2500);
}
async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${html}`;
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.innerHTML = html; }
}
function fmtTime(t) {
  if (!t) return "–";
  const d = new Date(t); if (isNaN(d)) return t;
  const opts = { month: "short", day: "numeric" };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  if (d.getHours() || d.getMinutes()) { opts.hour = "2-digit"; opts.minute = "2-digit"; }  // daily bars have no time
  return d.toLocaleString(undefined, opts);
}

// strategies: friendly names + info popup
async function ensureStrats() { if (!STRATS.length) STRATS = await api("/api/strategies"); return STRATS; }
const strat = key => STRATS.find(s => s.name === key);
const sname = key => strat(key)?.display_name || key;
const infoBtn = key => `<button type="button" class="ibtn" title="What is this strategy?" onclick="event.stopPropagation();showStrategyInfo('${esc(key)}')">i</button>`;
function showStrategyInfo(key) {
  const s = strat(key); if (!s) return;
  const e = s.explainer || {};
  const params = Object.entries(s.params);
  $("#info-title").textContent = s.display_name;
  $("#info-body").innerHTML = `
    <p class="sum">${esc(e.summary || s.description)}</p>
    ${e.how ? `<section><h3>How it works</h3><p>${esc(e.how)}</p></section>` : ""}
    ${e.good || e.bad ? `<div class="pros-cons">
      <div><h3 class="good">Works well when</h3><p>${esc(e.good || "–")}</p></div>
      <div><h3 class="bad">Struggles when</h3><p>${esc(e.bad || "–")}</p></div></div>` : ""}
    ${e.sizing ? `<section><h3>How much it buys</h3><p>${esc(e.sizing)}</p></section>` : `<section><h3>How much it buys</h3><p>The instance's money is split equally across its symbols, and each one is either fully in or fully out.</p></section>`}
    ${e.caveat ? `<div class="note warnbox">${esc(e.caveat)}</div>` : ""}
    <section><h3>What it needs</h3><p>${s.interval ? `${esc(s.interval)} price bars (candles).` : "Works on any bar size; daily (1d) by default."}
      ${s.recommended?.symbols ? ` Trades ${esc(s.recommended.symbols.join(" and "))} unless you choose others.` : ""}
      ${s.recommended?.max_leverage > 1 ? ` May use up to ${s.recommended.max_leverage}× leverage (borrowed money).` : ""}</p></section>
    ${params.length ? `<section><h3>Settings you can change</h3><table>${params.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td class="num">${esc(v)}</td><td style="white-space:normal">${esc(s.param_help?.[k] || "")}</td></tr>`).join("")}</table></section>` : ""}
    <div class="row"><a class="btn" style="text-decoration:none" href="#/backtest?s=${encodeURIComponent(key)}" onclick="this.closest('dialog').close()">Backtest it</a>
      <button onclick="this.closest('dialog').close();editInstance(null,{strategy:'${esc(key)}'})">Paper trade it</button></div>
    <p class="muted" style="font-size:12px;margin:0">Internal name: <code>${esc(key)}</code> · source: ${esc(s.source || "–")}</p>`;
  $("#info").showModal();
}
const stratOptions = sel => STRATS.map(s => `<option value="${s.name}" ${s.name === sel ? "selected" : ""}>${esc(s.display_name)}</option>`).join("");

// theme toggle (remembered per browser)
(() => {
  let t = null; try { t = localStorage.getItem("theme"); } catch {}
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#0d1117";
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
    route();
  };
})();

// ----------------------------------------------------------------- chart
function lineChart(el, series, { yFmt = pct, height = 280, zero = true } = {}) {
  el.classList.add("chart"); el.style.height = height + "px";
  const pts = series.flatMap(s => s.points);
  if (!pts.length) { el.innerHTML = `<div class="empty">No data yet</div>`; return; }
  const W = el.clientWidth || 600, H = height, L = 58, R = 10, T = 10, B = 26;
  const xs = series.map(s => s.points.map(p => +new Date(p[0])));
  let xmin = Math.min(...xs.flat()), xmax = Math.max(...xs.flat()); if (xmin === xmax) xmax = xmin + 1;
  let ys = pts.map(p => p[1]).filter(v => v != null); if (zero) ys.push(0);
  let ymin = Math.min(...ys), ymax = Math.max(...ys); if (ymin === ymax) { ymin -= 1e-3; ymax += 1e-3; }
  const pad = (ymax - ymin) * .06; ymin -= pad; ymax += pad;
  const X = x => L + (x - xmin) / (xmax - xmin) * (W - L - R), Y = y => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B);
  const css = getComputedStyle(document.documentElement);
  const grid = css.getPropertyValue("--grid"), muted = css.getPropertyValue("--muted");
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) {
    const v = ymin + (ymax - ymin) * i / 4, y = Y(v);
    svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${muted}">${esc(yFmt(v, 1))}</text>`;
  }
  if (zero && ymin < 0 && ymax > 0) svg += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="${muted}" stroke-dasharray="3 3" opacity=".6"/>`;
  const span = xmax - xmin, ticks = W < 520 ? 2 : 5;
  for (let i = 0; i <= ticks; i++) {
    const x = xmin + span * i / ticks, d = new Date(x);
    const lab = span < 3 * 864e5 ? d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })
      : span < 400 * 864e5 ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" })
      : d.toLocaleDateString(undefined, { year: "numeric", month: "short" });
    svg += `<text x="${X(x)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === ticks ? "end" : "middle"}" font-size="11" fill="${muted}">${esc(lab)}</text>`;
  }
  series.forEach((s, i) => {
    const c = s.color || COLORS[i % COLORS.length];
    const d = s.points.filter(p => p[1] != null).map((p, j) => `${j ? "L" : "M"}${X(+new Date(p[0])).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    svg += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.width || 1.8}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  });
  svg += `<line id="xh" y1="${T}" y2="${H - B}" stroke="${muted}" opacity="0"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;
  if (series.length > 1 || series[0].name) {
    el.insertAdjacentHTML("beforeend", `<div class="legend" style="position:absolute;left:${L}px;top:${H}px">${series.map((s, i) => `<span><i style="background:${s.color || COLORS[i % COLORS.length]}"></i>${esc(s.name)}</span>`).join("")}</div>`);
    el.style.marginBottom = "28px";
  }
  const tip = $(".tip", el), xh = $("#xh", el), svgEl = $("svg", el);
  svgEl.onmousemove = e => {
    const r = svgEl.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * W;
    const xv = xmin + (mx - L) / (W - L - R) * (xmax - xmin);
    let rows = [], when = null;
    series.forEach((s, i) => {
      let best = null, bd = Infinity;
      for (const p of s.points) { const dd = Math.abs(+new Date(p[0]) - xv); if (dd < bd) { bd = dd; best = p; } }
      if (best) { when = when || best[0]; rows.push(`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color || COLORS[i % COLORS.length]};margin-right:5px"></i>${esc(s.name || "")} <b>${esc(yFmt(best[1]))}</b></div>`); }
    });
    xh.setAttribute("x1", mx); xh.setAttribute("x2", mx); xh.setAttribute("opacity", ".5");
    tip.innerHTML = `<div class="muted">${esc(fmtTime(when))}</div>${rows.join("")}`; tip.style.display = "block";

function spark(values, up) {
  if (!values || values.length < 2) return "";
  const W = 120, H = 32, mn = Math.min(...values), mx = Math.max(...values), r = mx - mn || 1;
  const d = values.map((v, i) => `${i ? "L" : "M"}${(i / (values.length - 1) * W).toFixed(1)},${(H - 2 - (v - mn) / r * (H - 4)).toFixed(1)}`).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="var(--${up ? "up" : "down"})" stroke-width="1.6"/></svg>`;
}

  if (m.max_drawdown != null) t += `At its worst point it was <b>${r(-m.max_drawdown)} below its previous high</b>; ask yourself if you'd have stuck with it through that. `;
  if (m.round_trips) t += `It made ${m.round_trips} trades and ${r(m.win_rate)} of them were winners.`;
  return t;
}
const METRICS = [
  ["total_return", "Total return", pct, "gain over the whole period"], ["benchmark_return", "Buy & hold", pct, "just holding the same stocks"],
  ["cagr", "Per year (CAGR)", pct, "average yearly growth"], ["max_drawdown", "Max drawdown", pct, "worst drop from a peak"],
  ["sharpe", "Sharpe", num, "return vs bumpiness; >1 is good"], ["win_rate", "Win rate", v => pct(v, 1), "share of winning trades"],
  ["round_trips", "Trades", v => num(v, 0), "completed round trips"], ["profit_factor", "Profit factor", num, "gross wins / gross losses"],
  ["exposure", "Time invested", v => pct(v, 0), "how often it holds a position"], ["end_equity", "Final equity", money, ""],
];
function renderBacktest(r, body) {
  const m = r.metrics, beat = m.total_return > m.benchmark_return;
  $("#b-out").innerHTML = `
    <div class="card" style="margin-top:14px">
      <div class="row" style="justify-content:space-between"><div><h2 style="margin:0" class="label-row">${esc(sname(body.strategy))} on ${esc(r.symbols.join(", "))} ${infoBtn(body.strategy)}</h2><div class="muted" style="font-size:12px">${esc(fmtTime(r.from))} → ${esc(fmtTime(r.to))} · ${esc(r.interval)} bars</div></div>
      <span class="pill ${beat ? "up" : "down"}">${beat ? "beat" : "lost to"} buy &amp; hold</span></div>
      <p style="margin:12px 0 0">${verdict(m)}</p>
      <div class="tiles" style="margin-top:14px">${METRICS.map(([k, l, f, h]) => `<div class="tile"><div class="l">${l}</div><div class="v ${["total_return", "cagr", "benchmark_return"].includes(k) ? cls(m[k]) : ""}">${f(m[k])}</div><div class="h">${h}</div></div>`).join("")}</div>
      <div id="b-chart" style="margin-top:16px"></div>
      <div class="row" style="margin-top:8px"><button id="b-paper">Paper trade this</button></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Trades <span class="muted" style="font-weight:400">(latest ${r.trades.length})</span></h2>
      ${r.trades.length ? `<div class="scroll" style="max-height:420px"><table><tr><th>Time</th><th>Symbol</th><th>Side</th><th class="num">Qty</th><th class="num">Price</th><th class="num">P&amp;L</th></tr>
      ${r.trades.map(t => `<tr><td>${esc(fmtTime(t.ts))}</td><td>${esc(t.symbol)}</td><td class="${t.side === "BUY" ? "up" : "down"}">${t.side}</td><td class="num">${num(Math.abs(t.qty), 4)}</td><td class="num">${num(t.price)}</td><td class="num ${cls(t.realized_pnl)}">${t.realized_pnl == null ? "" : money(t.realized_pnl)}</td></tr>`).join("")}</table></div>` : `<div class="muted">No trades.</div>`}</div>`;
  const base = r.equity[0]?.[1] || 1;
  lineChart($("#b-chart"), [
    { name: "Strategy", points: r.equity.map(p => [p[0], p[1] / base - 1]) },
    { name: "Buy & hold", points: r.equity.map(p => [p[0], p[2] / base - 1]), color: "#94a3b8", dash: "4 3", width: 1.4 },
  ]);
  $("#b-paper").onclick = () => editInstance(null, { strategy: body.strategy, symbols: r.symbols, params: body.params });
}

// ----------------------------------------------------------------- compare
pages.compare = async app => {
  app.innerHTML = `<h1>Compare strategies</h1><p class="sub">Every strategy on the same stocks and dates, ranked by Sharpe. The grey row is plain buy &amp; hold. Most strategies lose to it.</p>
    <div class="card"><div class="form">
      <label><span>Symbols</span><input id="c-symbols" value="SPY"></label>
      <label><span>Start</span><input id="c-start" type="date" value="2015-01-01"></label>
      <label><span>Bar size</span><select id="c-interval">${["1d", "1h", "15m", "5m"].map(x => `<option>${x}</option>`).join("")}</select></label>
      <label><span>Data source</span><select id="c-source"><option>yfinance</option><option>alpaca</option></select></label>
    </div><div class="row" style="margin-top:14px"><button class="primary" id="c-run">Compare</button></div></div><div id="c-out"></div>`;
  $("#c-run").onclick = e => busy(e.currentTarget, async () => {
    const body = { symbols: $("#c-symbols").value, start: $("#c-start").value, interval: $("#c-interval").value, source: $("#c-source").value };
    const r = await api("/api/compare", { method: "POST", body });
    const cols = [["total_return", "Total", pct], ["cagr", "Per year", pct], ["sharpe", "Sharpe", num], ["max_drawdown", "Max DD", pct], ["win_rate", "Win rate", v => pct(v, 0)], ["round_trips", "Trades", v => num(v, 0)], ["exposure", "Invested", v => pct(v, 0)]];
    await ensureStrats();
    $("#c-out").innerHTML = `<div class="card" style="margin-top:14px"><div class="scroll"><table><tr><th>Strategy</th>${cols.map(c => `<th class="num">${c[1]}</th>`).join("")}<th></th></tr>
      ${r.rows.map(row => `<tr style="${row.strategy === "buy_and_hold" ? "background:var(--panel-2)" : ""}"><td><span class="label-row"><b>${esc(sname(row.strategy))}</b>${infoBtn(row.strategy)}</span></td>${cols.map(([k, , f]) => `<td class="num ${["total_return", "cagr"].includes(k) ? cls(row[k]) : ""}">${f(row[k])}</td>`).join("")}<td><a href="#/backtest?s=${encodeURIComponent(row.strategy)}">details</a></td></tr>`).join("")}</table></div>
      ${r.skipped.length ? `<p class="muted" style="margin-bottom:0">Skipped (need other bar sizes): ${esc(r.skipped.map(sname).join(", "))}</p>` : ""}
      <p class="muted" style="font-size:12px;margin-bottom:0"><b>Total</b> = gain over the whole period · <b>Sharpe</b> = return vs bumpiness (higher is better, above 1 is good) · <b>Max DD</b> = worst drop from a high · <b>Invested</b> = share of time holding stocks</p></div>
      <div class="card" style="margin-top:14px"><h2>Growth</h2><div id="c-chart"></div></div>`;
    lineChart($("#c-chart"), r.rows.map(row => ({ name: sname(row.strategy), color: row.strategy === "buy_and_hold" ? "#94a3b8" : undefined,
      points: row.curve })));
  });
};

// ----------------------------------------------------------------- guide
const GLOSSARY = [
  ["Paper trading", "Trading with fake money on live prices. It tests a strategy for real without risking anything."],
  ["Backtest", "Replaying a strategy on past prices to see how it would have done. Useful, but the past doesn't guarantee the future."],
  ["Instance", "One robot trader in this app: one strategy, some symbols and its own pretend account. You can run many side by side."],
  ["Symbol / ticker", "A stock's short code. SPY is a fund that holds the 500 biggest US companies (the S&P 500), QQQ holds the 100 biggest Nasdaq companies (tech-heavy), AAPL is Apple."],
  ["Long", "Owning a stock. You make money if it goes up."],
  ["Short", "Borrowing a stock and selling it, then buying it back later. You make money if it goes down. Losses can be bigger than with long positions."],
  ["Flat", "Holding cash, no position."],
  ["Candle / bar", "The price summary for a period of time: where it opened, the high, the low and where it closed. \"5m bars\" = one candle per 5 minutes, \"1d\" = one per day."],
  ["Moving average", "The average price over the last N bars. It smooths out noise to show the trend. EMA is a version that gives recent bars more weight."],
  ["Stop-loss", "An automatic exit if the price moves against you by a set amount, to cap the loss. A trailing stop moves along as the trade goes your way."],
  ["Leverage", "Trading with borrowed money. 2× means positions can be up to twice your account. Gains and losses both get bigger."],
  ["Slippage", "The small extra cost of every trade: you usually buy slightly higher and sell slightly lower than the quoted price."],
  ["Total return", "How much the account grew (or shrank) over the whole period."],
  ["CAGR / per year", "The average yearly growth rate. Makes periods of different lengths comparable."],
  ["Max drawdown", "The worst drop from a previous high. −30% means at some point you were 30% below your best. The number that tests your nerves."],
  ["Sharpe ratio", "Return divided by how bumpy the ride was. Higher is better. Above 1 is good, and most strategies and the stock market land around 0.3–1."],
  ["Win rate", "Share of trades that made money. A low win rate is fine if the winners are much bigger than the losers, as with breakout strategies."],
  ["Profit factor", "Total money won ÷ total money lost. Above 1 = profitable."],
  ["Buy & hold", "Just buying and never selling. It's the benchmark: a strategy that can't beat it isn't worth the effort."],
  ["Market hours", "US stocks trade 9:30–16:00 New York time, Monday to Friday (except holidays). The bot only trades then."],
  ["Overfitting", "Tweaking settings until the backtest looks amazing. It usually just memorises the past and fails live. Be suspicious of settings that only work at one exact value."],
];
pages.guide = async app => {

};

// ----------------------------------------------------------------- updates
async function checkUpdate(fresh = false) {
  let u; try { u = await api(`/api/update${fresh ? "?fresh=1" : ""}`); } catch { return null; }
  const bar = $("#update-bar");
  bar.innerHTML = u.available && !u.git && !u.error ? `<div class="inner"><b>A new version of tradebot is available.</b>
    <span style="opacity:.9">Your keys, settings and trading history are kept.</span>
    <button class="small" id="upd-btn">Update now</button></div>` : "";
  const b = $("#upd-btn"); if (b) b.onclick = () => installUpdate(b);
  return u;
}
async function installUpdate(btn) {
  await busy(btn, async () => {
    const r = await api("/api/update", { method: "POST" });
    if (!r.updated) { toast(r.message || "Already up to date"); $("#update-bar").innerHTML = ""; return; }
    if (!r.restarting) { toast(r.message); $("#update-bar").innerHTML = ""; return; }
    $("#update-bar").innerHTML = `<div class="inner"><span class="spin"></span> <b>Updating and restarting…</b> the page reloads by itself.</div>`;
    await new Promise(res => setTimeout(res, 3000));
    for (let i = 0; i < 60; i++) {
      try { const res = await fetch("/api/overview"); if (res.ok) { location.reload(); return; } } catch {}
      await new Promise(res => setTimeout(res, 1500));
    }
    toast("The dashboard didn't come back. Close the tradebot window and start it again.", true);
  });
}
checkUpdate();
setInterval(checkUpdate, 30 * 60 * 1000);
