[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "2.0.0"
description = "Crypto autopilot: paper-trades on live prices and picks its own playbook every hour."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
"tradebot.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
