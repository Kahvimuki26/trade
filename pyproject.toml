[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Backtest and paper-trade US stock strategies, many instances side by side."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
"tradebot.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
